[project]
name = "archivum"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
    "anthropic>=0.49",
    "fastembed>=0.4",
    "qdrant-client>=1.12",
    "kuzu>=0.7",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "pydantic-settings>=2.5",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "bleach>=6.1.0",
    "readability-lxml>=0.8",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "ebooklib>=0.18",
    "openai-whisper>=20231117",
    "mcp>=1.0",
    "markdown>=3.7",
    "weasyprint>=62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archivum"]
