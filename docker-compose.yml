services:
  backend:
    build: ./apps/backend
    container_name: archivum-backend
    restart: unless-stopped
    extra_hosts:
      # On Linux, this maps `host.docker.internal` to the Docker host gateway.
      - "host.docker.internal:host-gateway"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_EXTRACTION_PROVIDER=${LLM_EXTRACTION_PROVIDER:-anthropic}
      - LLM_SYNTHESIS_PROVIDER=${LLM_SYNTHESIS_PROVIDER:-anthropic}
      - JWT_SECRET=${JWT_SECRET:-}
      - OWNER_PASSWORD=${OWNER_PASSWORD:-}
      - OWNER_USERNAME=${OWNER_USERNAME:-admin}
      - PUBLIC_WIKI_ENABLED=${PUBLIC_WIKI_ENABLED:-false}
      - PAGE_WRITE_WORKER_ENABLED=true
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_RECREATE_COLLECTION_ON_DIM_MISMATCH=true
      - WIKI_DIR=/data/wiki
      - RAW_DIR=/data/raw
      - DB_PATH=/data/archivum.db
      - KUZU_PATH=/data/kuzu
      - EMBED_PROVIDER=${EMBED_PROVIDER:-local}
      - EMBED_MODEL=${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      - EMBED_DIM=${EMBED_DIM:-0}
      - EMBED_OPENAI_COMPAT_PROVIDER=${EMBED_OPENAI_COMPAT_PROVIDER:-openai}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - EMBED_AZURE_API_VERSION=${EMBED_AZURE_API_VERSION:-2024-02-15-preview}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5-20251001}
      - LLM_SYNTHESIS_MODEL=${LLM_SYNTHESIS_MODEL:-claude-sonnet-4-6}
      - OPENAI_COMPAT_PROVIDER=${OPENAI_COMPAT_PROVIDER:-openai}
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - OPENAI_COMPAT_AZURE_API_VERSION=${OPENAI_COMPAT_AZURE_API_VERSION:-2024-02-15-preview}
    volumes:
      - wiki_data:/data/wiki
      - raw_data:/data/raw
      - db_data:/data
      - kuzu_data:/data/kuzu
    networks:
      - archivum-net
    depends_on:
      qdrant:
        condition: service_healthy

  frontend:
    build: ./apps/frontend
    container_name: archivum-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARCHIVUM_FRONTEND_PORT:-8473}:8080"
    networks:
      - archivum-net
    depends_on:
      backend:
        condition: service_started

  mcp:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.mcp
    container_name: archivum-mcp
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_EXTRACTION_PROVIDER=${LLM_EXTRACTION_PROVIDER:-anthropic}
      - LLM_SYNTHESIS_PROVIDER=${LLM_SYNTHESIS_PROVIDER:-anthropic}
      - JWT_SECRET=${JWT_SECRET:-}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_RECREATE_COLLECTION_ON_DIM_MISMATCH=true
      - WIKI_DIR=/data/wiki
      - RAW_DIR=/data/raw
      - DB_PATH=/data/archivum.db
      - KUZU_PATH=/data/kuzu
      - MCP_API_KEY=${MCP_API_KEY:-}
      - MCP_PORT=8001
      - EMBED_PROVIDER=${EMBED_PROVIDER:-local}
      - EMBED_MODEL=${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      - EMBED_DIM=${EMBED_DIM:-0}
      - EMBED_OPENAI_COMPAT_PROVIDER=${EMBED_OPENAI_COMPAT_PROVIDER:-openai}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - EMBED_AZURE_API_VERSION=${EMBED_AZURE_API_VERSION:-2024-02-15-preview}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5-20251001}
      - LLM_SYNTHESIS_MODEL=${LLM_SYNTHESIS_MODEL:-claude-sonnet-4-6}
      - OPENAI_COMPAT_PROVIDER=${OPENAI_COMPAT_PROVIDER:-openai}
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - OPENAI_COMPAT_AZURE_API_VERSION=${OPENAI_COMPAT_AZURE_API_VERSION:-2024-02-15-preview}
    ports:
      - "8001:8001"
    volumes:
      - wiki_data:/data/wiki
      - raw_data:/data/raw
      - db_data:/data
      - kuzu_data:/data/kuzu
    networks:
      - archivum-net
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: archivum-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - archivum-net
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \"200\"'"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: archivum-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - archivum-net

  caddy:
    image: caddy:2-alpine
    container_name: archivum-caddy
    restart: unless-stopped
    environment:
      - ARCHIVUM_HOST=${ARCHIVUM_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - archivum-net
    depends_on:
      - backend
      - frontend

volumes:
  wiki_data:
  raw_data:
  db_data:
  kuzu_data:
  qdrant_data:
  ollama_data:
  caddy_data:
  caddy_config:

networks:
  archivum-net:
    driver: bridge
